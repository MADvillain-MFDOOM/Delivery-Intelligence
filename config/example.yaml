# Generic public example configuration. Replace placeholders through deployment
# configuration or environment variables; do not commit credentials or private URLs.

jira:
  base_url: ${JIRA_BASE_URL}
  user_email: ${JIRA_USER_EMAIL}
  api_token: ${JIRA_API_TOKEN}
  projects:
    - PROJECT_PLACEHOLDER
  issue_types:
    initiative: Initiative
    epic: Epic
    story: Story
    bug: Bug

hierarchy:
  Initiative:
    - Epic
  Epic:
    - Story
    - Bug

delivery:
  estimated_issue_types:
    - Story
    - Bug
  completed_statuses:
    - Done
  excluded_statuses:
    - Cancelled

forecast_readiness:
  require_estimate:
    - Story
    - Bug
  require_parent:
    - Epic
    - Story
    - Bug
  require_team: true

analysis:
  timezone: UTC
  reporting_period: week
  estimation_unit: generic_units

forecasting:
  history_sprints: 8
  minimum_history_observations: 3
  scenario_percentiles:
    conservative: 25
    expected: 50
    optimistic: 75
