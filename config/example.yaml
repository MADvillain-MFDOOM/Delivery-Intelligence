# Generic public example configuration. Replace placeholders through deployment
# configuration or environment variables; do not commit credentials or private URLs.

jira:
  base_url: ${JIRA_BASE_URL}
  user_email: ${JIRA_USER_EMAIL}
  api_token: ${JIRA_API_TOKEN}
  projects:
    - PROJECT_PLACEHOLDER
  issue_types:
    - DeliveryItem
    - Subtask
  statuses:
    todo: [To Do]
    in_progress: [In Progress]
    done: [Done]

hierarchy:
  parent_field: parent
  levels:
    - initiative
    - delivery_item
    - subtask

governance:
  completion_statuses: [Done]
  excluded_statuses: [Cancelled]
  require_estimate_for_forecast: true
  require_start_and_completion_dates: true

analysis:
  timezone: UTC
  reporting_period: week
  estimation_unit: generic_units
